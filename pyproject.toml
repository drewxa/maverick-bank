[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "maverick-bank"
version = "0.1.0"
description = "Local, inspectable shared memory for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Maverick Bank contributors"}]
keywords = ["mcp", "memory", "codex", "claude", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "mcp>=2.3,<3",
  "PyYAML>=6.0.2,<7",
  "filelock>=3.20,<4",
  "tomlkit>=0.13.3,<1",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.7,<1"]

[project.scripts]
maverick-bank = "maverick_bank.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/maverick_bank"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README*", "LICENSE", "SECURITY.md", "CHANGELOG.md", "pyproject.toml", "uv.lock", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["semantic: needs explicitly provisioned local model"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
