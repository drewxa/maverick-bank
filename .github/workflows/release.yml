name: Build release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --no-sync pytest -q
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - run: uv run --no-sync python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: maverick-bank-release-candidate
          path: dist/*
